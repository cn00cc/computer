<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盤子鑑定機 🔍 買貴直接笑</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0f172a; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px 16px; }
        header { text-align: center; margin: 16px 0 20px; }
        header h1 { font-size: 28px; font-weight: 900; color: #fbbf24; letter-spacing: 1px; }
        header p { color: #94a3b8; font-size: 14px; margin-top: 6px; }
        .card { width: 100%; max-width: 420px; background-color: #1e293b; border-radius: 16px; padding: 24px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4); }
        .api-settings { margin-bottom: 18px; background-color: rgba(15, 23, 42, 0.6); border: 1px solid #334155; border-radius: 10px; padding: 10px 14px; font-size: 13px; }
        .api-settings summary { cursor: pointer; color: #94a3b8; font-weight: bold; user-select: none; }
        .api-input-group { display: flex; gap: 8px; margin-top: 10px; }
        .api-input-group input { flex: 1; background-color: #0f172a; border: 1px solid #475569; border-radius: 8px; padding: 8px 10px; color: #ffffff; font-size: 12px; outline: none; }
        .btn-save-key { background-color: #334155; color: #fbbf24; border: 1px solid #475569; border-radius: 8px; padding: 0 12px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .api-hint { font-size: 11px; color: #64748b; margin-top: 6px; line-height: 1.4; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 14px; font-weight: bold; color: #cbd5e1; margin-bottom: 8px; }
        .upload-box { border: 2px dashed #475569; border-radius: 12px; padding: 28px 16px; text-align: center; cursor: pointer; background-color: rgba(15, 23, 42, 0.5); }
        .upload-icon { font-size: 36px; display: block; margin-bottom: 8px; }
        .upload-title { font-size: 15px; font-weight: bold; color: #e2e8f0; }
        .upload-sub { font-size: 12px; color: #64748b; margin-top: 4px; }
        #image-input { display: none; }
        #image-preview { max-height: 220px; max-width: 100%; border-radius: 8px; margin: 0 auto; display: none; }
        .input-wrapper { position: relative; }
        .currency { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-weight: bold; font-size: 18px; }
        input[type="number"] { width: 100%; background-color: #0f172a; border: 1px solid #475569; border-radius: 12px; padding: 14px 14px 14px 34px; color: #ffffff; font-size: 18px; font-weight: bold; outline: none; }
        .btn-primary { width: 100%; background-color: #f59e0b; color: #0f172a; font-size: 18px; font-weight: 900; padding: 14px; border: none; border-radius: 12px; cursor: pointer; }
        .loading { display: none; text-align: center; margin-top: 30px; }
        .spinner { width: 38px; height: 38px; border: 4px solid #fbbf24; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading p { color: #fbbf24; font-weight: bold; margin-top: 12px; font-size: 15px; }
        .result-card { display: none; width: 100%; max-width: 420px; margin-top: 24px; border-radius: 16px; padding: 24px; background-color: #1e293b; border: 2px solid #ef4444; }
        .result-header { text-align: center; border-bottom: 1px solid #334155; padding-bottom: 16px; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 900; margin-bottom: 8px; }
        .rank-title { font-size: 26px; font-weight: 900; margin-top: 4px; }
        .product-name { font-size: 14px; color: #e2e8f0; font-weight: bold; margin-top: 8px; }
        .product-note { font-size: 12px; color: #94a3b8; margin-top: 4px; }
        .price-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 18px 0; text-align: center; }
        .price-box { background-color: rgba(15, 23, 42, 0.8); padding: 12px; border-radius: 12px; border: 1px solid #334155; }
        .price-label { font-size: 12px; color: #94a3b8; }
        .price-val { font-size: 20px; font-weight: 900; margin-top: 4px; }
        .roast-box { background-color: rgba(2, 6, 23, 0.7); border-radius: 12px; padding: 16px; border: 1px solid #1e293b; }
        .roast-text { font-size: 15px; font-weight: bold; line-height: 1.5; }
        .diff-detail { font-size: 12px; color: #94a3b8; margin-top: 8px; }
        .btn-copy { width: 100%; margin-top: 16px; background-color: #10b981; color: #0f172a; font-weight: 900; padding: 13px; border: none; border-radius: 12px; font-size: 15px; cursor: pointer; }
        .btn-reset { width: 100%; margin-top: 10px; background-color: #334155; color: #ffffff; font-weight: bold; padding: 12px; border: none; border-radius: 12px; font-size: 14px; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <h1>🍽️ 盤子鑑定機</h1>
        <p>拍照比價，看看你是不是財富自由大慈善家</p>
    </header>
    <main class="card">
        <details class="api-settings" id="api-details">
            <summary id="api-status-text">⚙️ Gemini AI 真實辨識設定（未設定，目前為模擬模式）</summary>
            <div class="api-input-group">
                <input type="password" id="gemini-api-key" placeholder="貼上你的 Gemini API Key">
                <button type="button" class="btn-save-key" onclick="saveApiKey()">儲存</button>
            </div>
            <p class="api-hint">填寫 Google AI Studio 免費申請的 API Key，即可自動辨識商品型號並估算台灣市價。</p>
        </details>
        <div class="form-group">
            <label>1. 拍下商品或上傳照片</label>
            <div class="upload-box" onclick="document.getElementById('image-input').click()">
                <input type="file" id="image-input" accept="image/*" capture="environment" onchange="previewImage(event)">
                <div id="upload-placeholder">
                    <span class="upload-icon">📸</span>
                    <div class="upload-title">點擊開啟相機 / 選擇照片</div>
                    <div class="upload-sub">支援拍商品外觀、包裝或條碼</div>
                </div>
                <img id="image-preview" alt="商品預覽">
            </div>
        </div>
        <div class="form-group">
            <label for="user-price">2. 他買多少錢？（新台幣）</label>
            <div class="input-wrapper">
                <span class="currency">$</span>
                <input type="number" id="user-price" placeholder="例如：1500">
            </div>
        </div>
        <button onclick="analyzeItem()" id="submit-btn" class="btn-primary">開始鑑定是不是盤子 🔍</button>
    </main>
    <div id="loading" class="loading">
        <div class="spinner"></div>
        <p id="loading-text">AI 正在全網搜刮最低價...</p>
    </div>
    <section id="result-card" class="result-card">
        <div class="result-header">
            <span id="badge-tag" class="badge">鑑定報告</span>
            <h2 id="rank-title" class="rank-title">頂級黃金大盤 🏆</h2>
            <p id="product-name" class="product-name">辨識商品：範例商品</p>
            <p id="product-note" class="product-note"></p>
        </div>
        <div class="price-grid">
            <div class="price-box">
                <div class="price-label">他的入手價</div>
                <div id="display-user-price" class="price-val" style="color: #f87171;">$0</div>
            </div>
            <div class="price-box">
                <div class="price-label">市場參考最低價</div>
                <div id="display-market-price" class="price-val" style="color: #34d399;">$0</div>
            </div>
        </div>
        <div class="roast-box">
            <p id="roast-comment" class="roast-text"></p>
            <p id="diff-detail" class="diff-detail"></p>
        </div>
        <button onclick="copyShareText()" id="copy-btn" class="btn-copy">📋 複製鑑定結果文案（貼群組嘲諷）</button>
        <button onclick="resetForm()" class="btn-reset">再鑑定下一個商品 🔄</button>
    </section>
