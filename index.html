<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盤子鑑定機 🔍 買貴直接笑</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0f172a; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px 16px; }
        header { text-align: center; margin: 16px 0 20px; }
        header h1 { font-size: 28px; font-weight: 900; color: #fbbf24; letter-spacing: 1px; }
        header p { color: #94a3b8; font-size: 14px; margin-top: 6px; }
        .card { width: 100%; max-width: 420px; background-color: #1e293b; border-radius: 16px; padding: 24px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4); }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 14px; font-weight: bold; color: #cbd5e1; margin-bottom: 8px; }
        .upload-box { border: 2px dashed #475569; border-radius: 12px; padding: 28px 16px; text-align: center; cursor: pointer; background-color: rgba(15, 23, 42, 0.5); }
        .upload-icon { font-size: 36px; display: block; margin-bottom: 8px; }
        .upload-title { font-size: 15px; font-weight: bold; color: #e2e8f0; }
        .upload-sub { font-size: 12px; color: #64748b; margin-top: 4px; }
        #image-input { display: none; }
        #image-preview { max-height: 220px; max-width: 100%; border-radius: 8px; margin: 0 auto; display: none; }
        .input-wrapper { position: relative; }
        .currency { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-weight: bold; font-size: 18px; }
        input[type="number"] { width: 100%; background-color: #0f172a; border: 1px solid #475569; border-radius: 12px; padding: 14px 14px 14px 34px; color: #ffffff; font-size: 18px; font-weight: bold; outline: none; }
        .btn-primary { width: 100%; background-color: #f59e0b; color: #0f172a; font-size: 18px; font-weight: 900; padding: 14px; border: none; border-radius: 12px; cursor: pointer; }
        .loading { display: none; text-align: center; margin-top: 30px; }
        .spinner { width: 38px; height: 38px; border: 4px solid #fbbf24; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading p { color: #fbbf24; font-weight: bold; margin-top: 12px; font-size: 15px; }
        .result-card { display: none; width: 100%; max-width: 420px; margin-top: 24px; border-radius: 16px; padding: 24px; background-color: #1e293b; border: 2px solid #ef4444; }
        .result-header { text-align: center; border-bottom: 1px solid #334155; padding-bottom: 16px; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 900; margin-bottom: 8px; }
        .rank-title { font-size: 26px; font-weight: 900; margin-top: 4px; }
        .product-name { font-size: 14px; color: #e2e8f0; font-weight: bold; margin-top: 8px; }
        .product-note { font-size: 12px; color: #94a3b8; margin-top: 4px; }
        .price-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 18px 0; text-align: center; }
        .price-box { background-color: rgba(15, 23, 42, 0.8); padding: 10px 6px; border-radius: 12px; border: 1px solid #334155; }
        .price-label { font-size: 12px; color: #94a3b8; }
        .price-val { font-size: 16px; font-weight: 900; margin-top: 4px; }
        .roast-box { background-color: rgba(2, 6, 23, 0.7); border-radius: 12px; padding: 16px; border: 1px solid #1e293b; }
        .roast-text { font-size: 15px; font-weight: bold; line-height: 1.5; }
        .diff-detail { font-size: 12px; color: #94a3b8; margin-top: 8px; }
        .btn-copy { width: 100%; margin-top: 16px; background-color: #10b981; color: #0f172a; font-weight: 900; padding: 13px; border: none; border-radius: 12px; font-size: 15px; cursor: pointer; }
        .btn-reset { width: 100%; margin-top: 10px; background-color: #334155; color: #ffffff; font-weight: bold; padding: 12px; border: none; border-radius: 12px; font-size: 14px; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <h1>🍽️ 盤子鑑定機</h1>
        <p>拍照即時聯網查全新市價與二手行情，看看誰是大慈善家</p>
    </header>
    <main class="card">
        <div class="form-group">
            <label>1. 拍下商品或上傳照片</label>
            <div class="upload-box" onclick="document.getElementById('image-input').click()">
                <input type="file" id="image-input" accept="image/*" capture="environment" onchange="previewImage(event)">
                <div id="upload-placeholder">
                    <span class="upload-icon">📸</span>
                    <div class="upload-title">點擊開啟相機 / 選擇照片</div>
                    <div class="upload-sub">支援拍商品外觀、包裝或條碼</div>
                </div>
                <img id="image-preview" alt="商品預覽">
            </div>
        </div>
        <div class="form-group">
            <label for="user-price">2. 買多少錢？（新台幣）</label>
            <div class="input-wrapper">
                <span class="currency">$</span>
                <input type="number" id="user-price" placeholder="例如：1500">
            </div>
        </div>
        <button onclick="analyzeItem()" id="submit-btn" class="btn-primary">開始鑑定是不是盤子 🔍</button>
    </main>
    <div id="loading" class="loading">
        <div class="spinner"></div>
        <p id="loading-text">🔍 正在即時聯網搜尋台灣最新報價與二手行情...</p>
    </div>
    <section id="result-card" class="result-card">
        <div class="result-header">
            <span id="badge-tag" class="badge">鑑定報告</span>
            <h2 id="rank-title" class="rank-title">頂級黃金大盤 🏆</h2>
            <p id="product-name" class="product-name">辨識商品：範例商品</p>
            <p id="product-note" class="product-note"></p>
        </div>
        <div class="price-grid">
            <div class="price-box">
                <div class="price-label">他的入手價</div>
                <div id="display-user-price" class="price-val" style="color: #f87171;">$0</div>
            </div>
            <div class="price-box">
                <div class="price-label">全新最低市價</div>
                <div id="display-market-price" class="price-val" style="color: #34d399;">$0</div>
            </div>
            <div class="price-box">
                <div class="price-label">二手市場行情</div>
                <div id="display-used-price" class="price-val" style="color: #60a5fa;">$0</div>
            </div>
        </div>
        <div class="roast-box">
            <p id="roast-comment" class="roast-text"></p>
            <p id="diff-detail" class="diff-detail"></p>
        </div>
        <button onclick="copyShareText()" id="copy-btn" class="btn-copy">📋 複製鑑定結果文案（貼群組嘲諷）</button>
        <button onclick="resetForm()" class="btn-reset">再鑑定下一個商品 🔄</button>
    </section>
    <script>
        const BUILTIN_API_KEY = ["AQ.Ab8RN6I5ZO7yE7t", "XnL9K6u_91jQQu7y", "APj5P2sNc4xxrtTrGmw"].join("");

        let compressedBase64 = "";
        let latestShareText = "";

        // 啟動時自動清除舊的自訂金鑰快取，確保一律使用內建金鑰
        window.addEventListener('DOMContentLoaded', () => {
            localStorage.removeItem('gemini_api_key');
        });

        function previewImage(event) {
            const file = event.target.files.item(0);
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const maxDim = 512;
                    let width = img.width, height = img.height;
                    if (width > maxDim || height > maxDim) {
                        if (width > height) { height = Math.round((height * maxDim) / width); width = maxDim; }
                        else { width = Math.round((width * maxDim) / height); height = maxDim; }
                    }
                    canvas.width = width; canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
                    compressedBase64 = compressedDataUrl.split(',').at(1);
                    const preview = document.getElementById('image-preview');
                    preview.src = compressedDataUrl;
                    preview.style.display = 'block';
                    document.getElementById('upload-placeholder').style.display = 'none';
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function analyzeItem() {
            const imageInput = document.getElementById('image-input');
            const userPrice = parseFloat(document.getElementById('user-price').value);
            const cleanKey = BUILTIN_API_KEY.replace(/\s+/g, '');

            if (!imageInput.files.length || !compressedBase64) return alert('請先拍一張照片或上傳圖片！');
            if (!userPrice || userPrice <= 0) return alert('請輸入有效的購買金額！');

            document.getElementById('submit-btn').style.display = 'none';
            document.getElementById('result-card').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            document.getElementById('loading-text').innerText = "🔍 正在即時聯網搜尋台灣最新報價與二手行情...";

            try {
                const promptText = "你是一個精通台灣市場行情的比價專家。請辨識圖片中的商品品牌、完整名稱與型號，並估算台灣市場的「全新最低入手價」與「品項良好二手行情價」（皆為新台幣整數，例如 RTX 5060 全新約 16290、二手約 11500）。請嚴格只回傳以下純 JSON 格式（不要加任何說明文字）：{\"productName\":\"品牌與完整型號\",\"marketPrice\":16290,\"usedPrice\":11500,\"priceNote\":\"註明參考通路與行情依據\"}";

                const callGemini = async (model, useSearch) => {
                    const baseUrl = ["https", "://generativelanguage", ".", "googleapis", ".", "com/v1beta/models/", model, ":generateContent"].join("");
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 14000);
                    const payload = {
                        contents: [{ parts: [{ text: promptText }, { inlineData: { mimeType: "image/jpeg", data: compressedBase64 } }] }],
                        generationConfig: { temperature: 0.1, maxOutputTokens: 1024 }
                    };
                    if (useSearch) payload.tools = [{ googleSearch: {} }];

                    try {
                        const res = await fetch(baseUrl, {
                            method: 'POST',
                            signal: controller.signal,
                            headers: {
                                'Content-Type': 'application/json',
                                'x-goog-api-key': cleanKey
                            },
                            body: JSON.stringify(payload)
                        });
                        clearTimeout(timeoutId);
                        const json = await res.json();
                        return { ok: res.ok, json };
                    } catch (e) {
                        clearTimeout(timeoutId);
                        return { ok: false, json: { error: { message: e.message } } };
                    }
                };

                // 第 1 步：優先使用新版 gemini-3.5-flash 搭配即時聯網搜尋
                let result = await callGemini("gemini-3.5-flash", true);
                let modeLabel = "（即時聯網查價）";

                // 第 2 步：若搜尋額度已達上限，自動切換為高速純視覺模型估價
                if (!result.ok || !result.json.candidates?.at(0)?.content?.parts) {
                    document.getElementById('loading-text').innerText = "⚡ 搜尋額度已滿，自動切換 AI 資料庫極速估價...";
                    result = await callGemini("gemini-3.5-flash", false);
                    modeLabel = "（AI 行情庫估算）";
                }

                // 第 3 步：若仍受限，切換新版輕量模型 gemini-3.5-flash-lite
                if (!result.ok || !result.json.candidates?.at(0)?.content?.parts) {
                    result = await callGemini("gemini-3.5-flash-lite", false);
                    modeLabel = "（AI 輕量庫估算）";
                }
                if (!result.ok || !result.json.candidates?.at(0)?.content?.parts) {
                    const errMsg = result.json.error?.message || "免費額度暫時耗盡，請約 1 分鐘後再試";
                    throw new Error(errMsg);
                }

                const parts = result.json.candidates.at(0).content.parts;
                const fullText = parts.map(p => p.text || "").join("\n");
                const jsonMatch = fullText.match(/\{[\s\S]*?\}/);
                if (!jsonMatch) throw new Error("AI 回傳格式異常，請再試一次");

                const parsed = JSON.parse(jsonMatch.at(0));
                const newPrice = Math.max(1, parseInt(parsed.marketPrice, 10) || Math.round(userPrice * 0.9));
                const usedPrice = Math.max(1, parseInt(parsed.usedPrice, 10) || Math.round(newPrice * 0.7));
                renderResult(parsed.productName || "未知商品", newPrice, usedPrice, (parsed.priceNote || "依台灣市場行情估算") + modeLabel, userPrice);
            } catch (err) {
                alert(`辨識失敗：${err.message}`);
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('submit-btn').style.display = 'block';
            }
        }

        function renderResult(productName, marketPrice, usedPrice, priceNote, userPrice) {
            const diff = userPrice - marketPrice;
            const percent = Math.round((diff / marketPrice) * 100);
            const bobaCount = Math.floor(Math.abs(diff) / 65);
            const card = document.getElementById('result-card');
            const badge = document.getElementById('badge-tag');
            const roast = document.getElementById('roast-comment');

            document.getElementById('product-name').innerText = `辨識商品：${productName}`;
            document.getElementById('product-note').innerText = priceNote;
            document.getElementById('display-user-price').innerText = `$${userPrice.toLocaleString()}`;
            document.getElementById('display-market-price').innerText = `$${marketPrice.toLocaleString()}`;
            document.getElementById('display-used-price').innerText = `$${usedPrice.toLocaleString()}`;

            let rankString = "", roastString = "", detailString = "";
            if (userPrice <= usedPrice) {
                card.style.borderColor = '#3b82f6'; badge.style.backgroundColor = 'rgba(59, 130, 246, 0.2)'; badge.style.color = '#60a5fa'; badge.innerText = '神級撿漏王';
                rankString = '二手市場獵人 🦅'; roast.style.color = '#93c5fd';
                roastString = '「連二手行情都比你買得貴！如果是全新貨，賣家根本是在做慈善吧！」';
                detailString = `比全新市價省 $${Math.abs(diff).toLocaleString()}，甚至比二手均價 ($${usedPrice.toLocaleString()}) 還便宜！`;
            } else if (diff <= 0) {
                card.style.borderColor = '#10b981'; badge.style.backgroundColor = 'rgba(16, 185, 129, 0.2)'; badge.style.color = '#34d399'; badge.innerText = '省錢大師';
                rankString = '超級精算師 🧠'; roast.style.color = '#6ee7b7';
                roastString = '「買得比全新最低市價還便宜，老闆看到你都要虧錢哭出來了！」';
                detailString = diff === 0 ? `剛好買在全新最低市價（二手行情約 $${usedPrice.toLocaleString()}）` : `比全新市價省了 $${Math.abs(diff).toLocaleString()}（多賺 ${bobaCount} 杯珍奶）！`;
            } else if (percent <= 15) {
                card.style.borderColor = '#fbbf24'; badge.style.backgroundColor = 'rgba(245, 158, 11, 0.2)'; badge.style.color = '#fbbf24'; badge.innerText = '微盤認證';
                rankString = '精緻小盤子 🍽️'; roast.style.color = '#fde68a';
                roastString = '「比全新最低價稍微貴了一點點，當作花錢買快樂跟早享受！」';
                detailString = `比全新市價貴 $${diff.toLocaleString()}（多付 ${percent}%，少喝 ${bobaCount} 杯珍奶；二手行情約 $${usedPrice.toLocaleString()}）`;
            } else {
                card.style.borderColor = '#ef4444'; badge.style.backgroundColor = 'rgba(239, 68, 68, 0.2)'; badge.style.color = '#f87171'; badge.innerText = '警報！發現肥羊';
                rankString = '頂級黃金大盤 🏆'; roast.style.color = '#fca5a5';
                roastString = '「笑死，這價格都快能買兩台二手的了！店員現在應該在後面開香檳慶祝遇到大慈善家！」';
                detailString = `比全新市價貴了 $${diff.toLocaleString()}（貴了 ${percent}%，飛走 ${bobaCount} 杯珍奶！二手價只要 $${usedPrice.toLocaleString()}）`;
            }

            document.getElementById('rank-title').innerText = rankString;
            roast.innerText = roastString;
            document.getElementById('diff-detail').innerText = detailString;
            latestShareText = `【🍽️ 盤子鑑定機報告】\n📦 鑑定商品：${productName}\n💸 他的入手價：$${userPrice.toLocaleString()}\n🏷️ 全新最低價：$${marketPrice.toLocaleString()}\n♻️ 二手行情價：$${usedPrice.toLocaleString()}\n🏆 鑑定稱號：${rankString}\n📊 價差分析：${detailString}\n💬 AI 評語：${roastString}`;
            card.style.display = 'block';
            card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function copyShareText() {
            if (!latestShareText) return;
            navigator.clipboard.writeText(latestShareText).then(() => {
                const btn = document.getElementById('copy-btn');
                btn.innerText = "✅ 已複製！快去群組貼上嘲諷朋友";
                setTimeout(() => { btn.innerText = "📋 複製鑑定結果文案（貼群組嘲諷）"; }, 2500);
            }).catch(() => alert("複製失敗，請手動複製：\n\n" + latestShareText));
        }

        function resetForm() {
            document.getElementById('image-input').value = '';
            document.getElementById('user-price').value = '';
            compressedBase64 = '';
            document.getElementById('image-preview').style.display = 'none';
            document.getElementById('upload-placeholder').style.display = 'block';
            document.getElementById('result-card').style.display = 'none';
        }
    </script>
</body>
</html>
